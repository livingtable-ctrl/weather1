[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: live API tests (some require KALSHI_ENV=demo, e.g. Kalshi client calls) — excluded from normal pytest runs by default, run with '-m integration'",
    "cron_integration: cmd_cron() orchestration tests that use only mocks — CI-safe, run by default like any other test",
]

[tool.coverage.run]
omit = [
    "backtest.py",
    "param_sweep.py",
    "feature_importance.py",
    "pdf_report.py",
    "tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.",
    "pragma: no cover",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes (unused imports, undefined names, etc.)
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade (modernize syntax)
]
ignore = [
    "E501",  # line too long — handled by formatter
]

[tool.ruff.lint.per-file-ignores]
# main.py calls load_dotenv() before local imports so env-var constants are
# set correctly at module load time — E402 is intentional here.
"main.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
implicit_optional = true
warn_unused_ignores = false
warn_return_any = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "kalshi_client"
ignore_errors = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "pdf_report"
ignore_errors = true
