<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kalshi Weather Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,700&display=swap"
      rel="stylesheet"
    />
    <script>
      // batch-48 item 7: sets the theme CSS vars synchronously, before React
      // mounts (and before first paint), so a dark-mode OS user never sees a
      // white flash while waiting for App.jsx's post-mount useEffect to catch
      // up. Must stay in sync with THEMES in src/App.jsx -- there is no
      // stylesheet-based source of truth for these values to import from a
      // blocking, non-module <script> this early in <head>.
      (function () {
        var THEMES = {
          light: {
            '--bg-page': '#fafafa', '--bg-card': '#ffffff', '--bg-subtle': '#f8f9fb',
            '--bg-muted': '#f1f5f9', '--border': '#e7eaef',
            '--text': '#0f172a', '--text-muted': '#64748b', '--text-faint': '#94a3b8',
            '--pos': '#16a34a', '--pos-fill': 'rgba(34,197,94,0.12)',
            '--neg': '#dc2626', '--neg-fill': 'rgba(239,68,68,0.12)',
            '--warn': '#92400e', '--warn-fill': 'rgba(234,179,8,0.12)',
            '--accent': '#2563eb', '--accent-fill': 'rgba(59,130,246,0.12)',
          },
          dark: {
            '--bg-page': '#0f1115', '--bg-card': '#181b22', '--bg-subtle': '#1e222a',
            '--bg-muted': '#2a2f3a', '--border': '#2e333d',
            '--text': '#eef0f5', '--text-muted': '#a3acb8', '--text-faint': '#737d8a',
            '--pos': '#4ade80', '--pos-fill': 'rgba(74,222,128,0.16)',
            '--neg': '#f87171', '--neg-fill': 'rgba(248,113,113,0.16)',
            '--warn': '#fbbf24', '--warn-fill': 'rgba(251,191,36,0.16)',
            '--accent': '#60a5fa', '--accent-fill': 'rgba(96,165,250,0.16)',
          },
        };
        var stored = localStorage.getItem('kalshi-theme');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = stored || (prefersDark ? 'dark' : 'light');
        var vars = THEMES[theme] || THEMES.light;
        var root = document.documentElement.style;
        for (var k in vars) root.setProperty(k, vars[k]);
        // opus review MEDIUM: setting the CSS *variables* isn't enough on its
        // own -- nothing in this app's stylesheets paints them until React
        // mounts and renders App.jsx's own `background: var(--bg-page)`
        // wrapper div (there's no global body{background} rule). Without
        // this, a dark-mode user still saw the browser's default white body
        // for the entire parse/module-download/mount window, i.e. the exact
        // flash this item exists to close. colorScheme also fixes native
        // form-control/scrollbar chrome (e.g. a native <select>'s dropdown)
        // rendering light-on-dark before mount.
        document.documentElement.style.backgroundColor = vars['--bg-page'];
        document.documentElement.style.color = vars['--text'];
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <script type="module" crossorigin src="/static/dist/assets/index-mkhzUIIL.js"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
